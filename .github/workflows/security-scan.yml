# Security scan: CodeQL (SAST) + TruffleHog (secrets).
#
# SELF-CONTAINED BY NECESSITY. Every private repo in this org calls the shared
# reusable workflow at SecurityMindedSolutions/shared-workflows@v1. This repo
# cannot: a PUBLIC repository may not call a reusable workflow stored in a
# PRIVATE repository, regardless of the org-level Actions access setting. The
# run fails at workflow-resolution time with no job, no log and no annotation.
#
# So this file inlines the same scan. Keep it in sync with shared-workflows'
# security-scan.yml when that changes. The duplication is cheap here and the
# alternative (making shared-workflows public) would expose the org's internal
# cost and security-posture notes.
#
# Cadence: TIER D (weekly + PR). Public repos do NOT consume Actions minutes,
# so frequency here is not a budget question.
#
# ONE JOB, ON PURPOSE: GitHub bills a minimum of one minute per job. That costs
# nothing on a public repo, but the shape is kept identical to the private
# repos so the two do not drift.
#
# NOTE: PR runs are diff-informed (CodeQL reports only within changed lines).
# The scheduled run is the full scan.

name: Security Scan

on:
  # Weekly, Monday 16:30 UTC.
  schedule:
    - cron: '30 16 * * 1'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # On pull_request TruffleHog auto-diffs base...head; on schedule it
          # walks full history. One setting, both behaviours.
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67 # codeql-bundle-v2.26.1

      - name: TruffleHog OSS
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70 # v3.95.6
        with:
          path: ./
          extra_args: --only-verified
