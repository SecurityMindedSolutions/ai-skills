# CLEAN: pull_request, actions pinned to SHAs, no secrets
name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f399cd34e1a4df1ad3ed6b1f5fcc4d9a7a34 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
      - run: pip install -r requirements.txt --require-hashes && pytest
