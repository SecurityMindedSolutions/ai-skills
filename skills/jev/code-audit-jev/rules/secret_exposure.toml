# Secret exposure: one rule of the code audit. Everything the runner knows about this
# category is in this file: the class text Jev chooses between, the yes/no
# questions it answers, the regex facts computed in code and handed to it, and
# how the answers compose into this rule's vector. Copy this file to add a rule.

id = "secret_exposure"
title = "Secret exposure"

# The option Jev sees in the "which class of defect is this" choice.
class = """`unit.code` contains a real credential as a literal (API key, token, password, private key, signed webhook URL), or writes one to a log, a response or a client-visible place."""

# vector = product(all) * product(1 - none). This is the "and" composed in code
# because Jev answers one literal condition at a time.
[vector]
all = ["secret_literal"]
none = []

# Code floor: when this signal fired with one of these labels AND the question
# answers at or above `min`, the unit is attention whatever the score.
[floor]
signal = "credential_literal"
labels = ["AWS access key id", "private key block", "Stripe key", "Google API key", "GitHub token", "Slack token", "Slack webhook URL", "connection string with password"]
min = 0.5

[questions.secret_literal]
instructions = """Does `unit.code` contain a real credential written as a literal: an API key, access token, password, private key, signing secret, or a webhook URL that embeds a token? Placeholders, examples, empty defaults, variable names, and values read from the environment or a secret manager do not count."""
true = """A literal value with the shape of a live credential is present (for example a provider-prefixed key, a private key block, a long random token assigned to a secret-named variable, or a webhook URL with an embedded token)."""
false = """No literal credential is present; secret-named variables are read from configuration, the environment or a secret store, or the literal is clearly a placeholder, example or test value."""

[signals.credential_literal]
label = "credential literal"
patterns = [
    '''AKIA[0-9A-Z]{16}''',  # AWS access key id
    '''-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----''',  # private key block
    '''\b(sk|rk)_(live|test)_[0-9a-zA-Z]{20,}''',  # Stripe key
    '''\bsk-[A-Za-z0-9\-_]{20,}''',  # API key (sk- prefix)
    '''\bAIza[0-9A-Za-z\-_]{35}''',  # Google API key
    '''\bgh[pousr]_[A-Za-z0-9]{36,}''',  # GitHub token
    '''xox[baprs]-[0-9A-Za-z\-]{10,}''',  # Slack token
    '''https://hooks\.slack\.com/services/T[0-9A-Z]+/B[0-9A-Z]+/[0-9A-Za-z]+''',  # Slack webhook URL
    '''eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{10,}''',  # JWT literal
    '''(?i)(password|passwd|pwd|secret|api_?key|token|client_secret|private_key|auth)\w*\s*[=:]\s*["'][^"'\s$<>{}]{8,}["']''',  # credential-looking assignment
    '''(?i)(mongodb|postgres|postgresql|mysql|redis|amqp)://[^:\s]+:[^@\s]+@''',  # connection string with password
]

[signals.placeholder_hint]
label = "looks like a placeholder"
patterns = [
    '''(?i)(example|placeholder|changeme|your[-_]|xxx+|<[^>]+>|dummy|fake|sample|test[-_]?key|\bTODO\b|redacted|\*{3,})''',  # looks like a placeholder
]

[signals.secret_manager]
label = "secret read from a manager or env"
patterns = [
    '''SecretManager|secretmanager|access_secret_version|getSecret|vault\.|ssm\.get_parameter|os\.environ|process\.env''',  # secret read from a manager or env
]
