# Supply chain: one rule of the code audit. Everything the runner knows about this
# category is in this file: the class text Jev chooses between, the yes/no
# questions it answers, the regex facts computed in code and handed to it, and
# how the answers compose into this rule's vector. Copy this file to add a rule.

id = "supply_chain"
title = "Supply chain"

# The option Jev sees in the "which class of defect is this" choice.
class = """`unit.code` fetches or installs code at build or deploy time without pinning to an immutable version or digest, pipes a download into a shell, or exposes secrets or write access to untrusted pull-request code."""

# vector = product(all) * product(1 - none). This is the "and" composed in code
# because Jev answers one literal condition at a time.
[vector]
all = ["unpinned_supply_chain"]
none = []

[questions.unpinned_supply_chain]
instructions = """Does `unit.code` fetch or install code at build or deploy time without pinning it to an immutable version or digest (an action, image, package or download pinned only to a branch, tag or 'latest', or not pinned at all), pipe a download into a shell, or run code from a pull request with access to secrets or write permissions?"""
true = """At least one fetch or install in `unit.code` is unpinned or pinned to a mutable reference, or a download is piped to a shell, or pull-request code runs with secrets or write access."""
false = """Every fetch and install is pinned to a digest, hash or exact version from a lock file, no download is piped to a shell, and untrusted pull-request code gets no secrets or write access; or the unit installs nothing."""

[signals.supply_chain]
label = "supply chain"
patterns = [
    '''uses:\s*[^@\s]+@(main|master|latest|v?\d+)\s*$|uses:\s*[^@\s]+\s*$|image:\s*[^@\s]+:latest|FROM\s+[^@\s]+(:latest|\s*$)|FROM\s+[^@\s:]+:[^@\s]+\s*$|curl[^|\n]*\|\s*(ba)?sh|wget[^|\n]*\|\s*(ba)?sh|pip install(?![^\n]*--require-hashes)|npm install(?! ci)|--no-verify|--allow-unauthenticated|pull_request_target|npx\s+\w+@latest|uv run --with|apk add(?![^\n]*=)|apt-get install(?![^\n]*=)''',  # unpinned or unverified supply-chain step
    '''\$\{\{\s*github\.event\.(issue|pull_request|comment|review|head_commit)\.[^}]*\}\}|\$\{\{\s*github\.head_ref''',  # workflow interpolates untrusted event text
]

[signals.secrets_in_ci]
label = "secret handled in a shell step"
patterns = [
    '''echo\s+[^|\n]*\$\{?\{?\s*secrets\.|secrets\.\w+\s*\}\}\s*>|env:\s*\n\s*\w*(TOKEN|SECRET|PASSWORD|KEY)\w*:\s*\$\{\{\s*secrets|set -x|--password[= ]|-p\s*\$\w*PASS''',  # secret handled in a shell step
]
