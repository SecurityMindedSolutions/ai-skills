# XML external entities and XML injection: one rule of the code audit.

id = "xml_xxe"
title = "XML external entities and XML injection"

class = """`unit.code` parses XML, XPath, XSLT or SVG from outside with external entities, DTDs or network access enabled (a parser without `resolve_entities=False` / `no_network`, a `DocumentBuilderFactory` without secure processing), or builds XML or XPath from an outside value without escaping."""

[vector]
all = ["xml_parsed_unsafely"]
none = []

[questions.xml_parsed_unsafely]
instructions = """Does `unit.code` parse XML, SVG, XPath or XSLT that could come from outside using a parser whose external entity, DTD or network resolution is not disabled (for example lxml without `resolve_entities=False` and `no_network=True`, Python xml.dom / xml.sax / minidom / pulldom, Java DocumentBuilderFactory without FEATURE_SECURE_PROCESSING, libxml with NOENT), or build an XML or XPath string from an outside value without escaping it?"""
true = """An XML/SVG/XPath/XSLT parse of outside data uses a parser with entity or DTD resolution left on, or an outside value is concatenated into XML or an XPath expression."""
false = """The parser is defusedxml or is configured with entities, DTDs and network resolution off, the input is a constant or generated by the system, XML is built by a serializer that escapes, or the unit handles no XML."""

[signals.xml_parse]
label = "XML parsed"
patterns = [
    '''etree\.(parse|fromstring|XMLParser)|minidom\.parse|xml\.sax|pulldom|xml\.dom|DocumentBuilderFactory|SAXParserFactory|XMLInputFactory|XmlReader|libxml|DOMParser\(\)|parseFromString\(|xpath\(|XPath|xslt|XSLT|resolve_entities|no_network|defusedxml''',
]
