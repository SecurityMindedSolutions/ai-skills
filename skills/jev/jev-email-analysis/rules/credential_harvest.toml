# Credential harvesting: one category of the email analysis. Everything the runner knows about this
# category lives in this file - the option Jev chooses between, the verdict it rolls up to, and
# any regex facts computed in code and handed to Jev as `code_signals`. Copy this file to add a
# category. See rules/README.md.

id = "credential_harvest"
title = "Credential harvesting"

# The verdict this category produces once risk, flags and the rules in _core.toml are applied.
verdict = "malicious"

# The option Jev sees in the "what is the primary purpose of this email" choice.
class = """Lures the recipient to sign in or enter credentials/MFA codes on a page it controls (fake shared doc, password expiry, mailbox full, voicemail)."""

[signals.signin_lure]
label = "sign-in or account-action lure"
patterns = [
    '''(?i)\b(sign ?in|log ?in|verify your (account|identity|email)|confirm your (password|account)|re-?authenticate|password (expires|expiring|reset)|mailbox (full|quota)|storage (full|exceeded))\b''',
]

[signals.mfa_ask]
label = "MFA or one-time code request"
patterns = [
    '''(?i)\b(one-?time (code|passcode)|otp\b|2fa|mfa|authenticator|verification code)\b''',
]
