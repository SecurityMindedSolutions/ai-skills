# Fake invoice or fee demand: one category of the email analysis. Everything the runner knows about this
# category lives in this file - the option Jev chooses between, the verdict it rolls up to, and
# any regex facts computed in code and handed to Jev as `code_signals`. Copy this file to add a
# category. See rules/README.md.

id = "fake_invoice"
title = "Fake invoice or fee demand"

# The verdict this category produces once risk, flags and the rules in _core.toml are applied.
verdict = "malicious"

# The option Jev sees in the "what is the primary purpose of this email" choice.
class = """Demands payment of an invoice, renewal, subscription, fine, tax, penalty or legal fee for something probably never ordered or owed, to an unknown party - including fake government, court or tax-authority penalty notices."""

[signals.fee_demand]
label = "fine, penalty or tax demand"
patterns = [
    '''(?i)\b(fine|penalty|infringement|tax (due|owed|arrears)|court|summons|legal fee|debt recovery)\b''',
]

[signals.renewal]
label = "renewal or subscription demand"
patterns = [
    '''(?i)\b(renewal|auto-?renew|subscription (expires|expiring|due)|listing fee|directory)\b''',
]
