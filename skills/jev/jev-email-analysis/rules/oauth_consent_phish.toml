# OAuth consent phishing: one category of the email analysis. Everything the runner knows about this
# category lives in this file - the option Jev chooses between, the verdict it rolls up to, and
# any regex facts computed in code and handed to Jev as `code_signals`. Copy this file to add a
# category. See rules/README.md.

id = "oauth_consent_phish"
title = "OAuth consent phishing"

# The verdict this category produces once risk, flags and the rules in _core.toml are applied.
verdict = "malicious"

# The option Jev sees in the "what is the primary purpose of this email" choice.
class = """Asks the recipient to grant a third-party app access/permissions to their account (OAuth consent) rather than type a password."""

[signals.consent]
label = "app permission / consent grant"
patterns = [
    '''(?i)\b(grant (access|permission)|authorize (the )?app|allow access to your|consent screen|oauth)\b''',
]
